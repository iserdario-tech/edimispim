# Сервер уведомлений и ИИ-коуча. Живой: edimispim-push.pospat.workers.dev
#
# Имя и KV — СВОИ, отдельные от pospat. Это не косметика: с прежними name = "pospat-push"
# и id чужого хранилища `wrangler deploy` отсюда перезаписал бы работающий Worker pospat,
# который рассылает пуши реальным людям.
#
# Приватный VAPID-ключ лежит в секретах Worker (`wrangler secret put VAPID_PRIVATE`),
# а не в репозитории. Публичный — в src/ui/notifications.ts.
name = "edimispim-push"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "SUBS"
id = "029865a7c24b424fb0c5462359ea77e2"

# Рассылка раз в 5 минут (проверяет, чьё окно наступило)
[triggers]
crons = ["*/5 * * * *"]

# Бесплатная ИИ Cloudflare для коуча (без ключа; лимит квоты — не деньги)
[ai]
binding = "AI"
