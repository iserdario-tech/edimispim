# ⚠️ Worker в v1 НЕ используется (пуши и коуч — v2). Лежит здесь как готовая заготовка.
#
# Имя и KV namespace намеренно изменены относительно pospat: раньше здесь стояли
# name = "pospat-push" и id живого хранилища подписок. С ними `wrangler deploy` из этого
# репозитория перезаписал бы работающий Worker pospat, который прямо сейчас рассылает пуши
# реальным подписчикам.
#
# Перед первым деплоем: `wrangler kv namespace create SUBS` и вставить выданный id ниже.
name = "edimispim-push"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "SUBS"
id = "ЗАПОЛНИТЬ_ПЕРЕД_ДЕПЛОЕМ"

# Рассылка раз в 5 минут (проверяет, чьё окно наступило)
[triggers]
crons = ["*/5 * * * *"]

# Бесплатная ИИ Cloudflare для коуча (без ключа; лимит квоты — не деньги)
[ai]
binding = "AI"
